<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eclipse v61 | Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --glass: rgba(255, 255, 255, 0.03); --border: rgba(255, 255, 255, 0.08); }
        body { background: #000; color: #fff; font-family: 'Outfit', sans-serif; margin: 0; overflow: hidden; }
        
        /* Glassmorphism Puro */
        .sidebar { width: 300px; background: #050505; border-right: 1px solid var(--border); height: 100vh; display: flex; flex-direction: column; transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
        .main-stage { flex-grow: 1; display: flex; flex-direction: column; height: 100vh; position: relative; background: radial-gradient(circle at 50% -20%, #111, #000); }
        
        /* Área de Mensagem Estilo "Bento" */
        .msg-node { max-width: 800px; margin: 0 auto 40px auto; padding: 25px; border-radius: 24px; background: var(--glass); border: 1px solid var(--border); animation: slideUp 0.6s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* Code Block Personalizado */
        pre { background: #080808 !important; border: 1px solid #1a1a1a; padding: 20px; border-radius: 16px; font-family: 'JetBrains Mono', monospace; font-size: 13px; position: relative; }
        .copy-chip { position: absolute; top: 12px; right: 12px; font-size: 10px; background: #fff; color: #000; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-weight: bold; }

        /* Input Flutuante */
        .input-anchor { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 800px; }
        .input-container { background: rgba(10, 10, 10, 0.8); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 30px; padding: 12px 24px; display: flex; align-items: center; gap: 15px; }
        
        input[type="file"] { display: none; }
        .attachment-trigger { cursor: pointer; opacity: 0.5; transition: 0.3s; }
        .attachment-trigger:hover { opacity: 1; transform: rotate(15deg); }

        .hidden { display: none !important; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="flex">

    <div id="boot-overlay" class="fixed inset-0 z-[9999] bg-black flex items-center justify-center transition-all duration-1000">
        <div class="text-center">
            <h1 class="text-5xl font-light tracking-[0.8em] mb-4 animate-pulse">ECLIPSE</h1>
            <div class="w-48 h-[1px] bg-zinc-800 mx-auto relative overflow-hidden">
                <div id="loader-bar" class="absolute inset-y-0 left-0 bg-white transition-all duration-700"></div>
            </div>
            <p id="boot-status" class="text-[10px] uppercase tracking-widest mt-6 opacity-30">Inicializando Gemini 2.0 Preview</p>
        </div>
    </div>

    <aside class="sidebar">
        <div class="p-10 border-b border-white/5">
            <div class="text-[10px] font-bold tracking-[0.4em] opacity-20 mb-8 uppercase">Intelligence v61</div>
            <button onclick="createNew()" class="w-full py-4 bg-white text-black rounded-2xl font-bold text-[11px] uppercase tracking-widest hover:invert transition">Novo Ciclo</button>
        </div>
        <div id="session-list" class="flex-1 overflow-y-auto p-6 no-scrollbar space-y-3"></div>
        <div class="p-8 border-t border-white/5">
            <div class="flex items-center gap-3 opacity-40 hover:opacity-100 transition cursor-help" title="Embeddings dimensionais ativos">
                <div class="w-2 h-2 rounded-full bg-green-500 animate-ping"></div>
                <span class="text-[10px] font-bold tracking-widest uppercase">Dim: 768 MRL</span>
            </div>
        </div>
    </aside>

    <main class="main-stage">
        <header class="h-20 flex items-center justify-between px-10 border-b border-white/5">
            <div id="current-title" class="text-xs font-bold tracking-widest uppercase opacity-40 italic">Iniciando...</div>
            <button onclick="resetData()" class="text-[9px] font-black text-red-500 uppercase tracking-tighter hover:opacity-100 opacity-30">Purge Data</button>
        </header>

        <div id="chat-flow" class="flex-1 overflow-y-auto py-12 no-scrollbar scroll-smooth">
            <div id="render-target" class="msg-node hidden"></div>
        </div>

        <div class="input-anchor">
            <div id="preview-area" class="mb-4 flex gap-2"></div>
            <div class="input-container">
                <label class="attachment-trigger">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
                    <input type="file" id="file-in" onchange="handleFile(this)">
                </label>
                <textarea id="main-in" rows="1" class="w-full bg-transparent border-none outline-none resize-none text-sm py-1" placeholder="Comando para a inteligência..." onkeydown="checkKey(event)"></textarea>
                <button onclick="triggerSend()" class="hover:scale-110 transition active:scale-95">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
                </button>
            </div>
        </div>
    </main>

    <script>
        let sessions = JSON.parse(localStorage.getItem('ec_sessions')) || [];
        let currentId = null;
        let userName = localStorage.getItem('ec_user') || "";
        let pendingFile = null;

        // Boot Sequence
        async function runBoot() {
            const bar = document.getElementById('loader-bar');
            const status = document.getElementById('boot-status');
            const steps = ["Sincronizando Embeddings...", "Carregando MRL 768...", "Conectando Gemini 2.0 Flash..."];
            
            for(let i=0; i<steps.length; i++){
                bar.style.width = ((i+1)*33) + "%";
                status.innerText = steps[i];
                await new Promise(r => setTimeout(r, 600));
            }

            if(!userName) {
                const name = prompt("Como devemos te chamar nesta sessão?");
                userName = name || "Explorador";
                localStorage.setItem('ec_user', userName);
            }

            document.getElementById('boot-overlay').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('boot-overlay').classList.add('hidden');
                init();
            }, 1000);
        }

        // File Handler (Multimodal)
        function handleFile(input) {
            const file = input.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                pendingFile = {
                    mimeType: file.type,
                    base64: e.target.result.split(',')[1],
                    name: file.name
                };
                document.getElementById('preview-area').innerHTML = `<div class="bg-white/10 px-3 py-1 rounded-full text-[10px] flex items-center gap-2">📎 ${file.name} <span class="cursor-pointer" onclick="clearFile()">✕</span></div>`;
            };
            reader.readAsDataURL(file);
        }

        function clearFile() {
            pendingFile = null;
            document.getElementById('preview-area').innerHTML = "";
            document.getElementById('file-in').value = "";
        }

        // Core Send Logic
        async function triggerSend() {
            const input = document.getElementById('main-in');
            const text = input.value.trim();
            if(!text && !pendingFile) return;

            const session = sessions.find(s => s.id === currentId);
            session.history.push({ role: 'user', parts: [{ text: text || "Analisar anexo" }] });
            
            if(session.title === "Novo Ciclo") session.title = text.substring(0, 20) + "...";

            input.value = "";
            const fileContext = pendingFile;
            clearFile();
            render();

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        messages: session.history, 
                        userName: userName,
                        fileData: fileContext 
                    })
                });
                const data = await res.json();
                session.history.push({ role: 'model', parts: [{ text: data.reply }] });
                save(); render();
            } catch(e) {
                session.history.push({ role: 'model', parts: [{ text: "Erro na Matrix: " + e.message }] });
                render();
            }
        }

        function render() {
            const target = document.getElementById('render-target');
            const flow = document.getElementById('chat-flow');
            const session = sessions.find(s => s.id === currentId);
            
            flow.innerHTML = "";
            document.getElementById('current-title').innerText = session.title;

            session.history.forEach(m => {
                const isAI = m.role === 'model';
                const node = document.createElement('div');
                node.className = 'msg-node';
                node.innerHTML = `
                    <div class="text-[9px] font-bold tracking-[0.3em] uppercase opacity-20 mb-4">${isAI ? 'Eclipse Intelligence' : userName}</div>
                    <div class="text-[15px] leading-relaxed opacity-90">${marked.parse(m.parts[0].text)}</div>
                `;
                flow.appendChild(node);
            });
            flow.scrollTop = flow.scrollHeight;
            renderSidebar();
        }

        // Renderização Lateral com Efeito de Foco
        function renderSidebar() {
            const list = document.getElementById('session-list');
            list.innerHTML = "";
            sessions.forEach(s => {
                const btn = document.createElement('div');
                btn.className = `chat-btn p-4 rounded-2xl cursor-pointer text-[10px] font-bold uppercase transition-all ${s.id === currentId ? 'bg-white text-black' : 'opacity-30 hover:opacity-100 hover:bg-white/5'}`;
                btn.onclick = () => { currentId = s.id; render(); };
                btn.innerText = s.title;
                list.appendChild(btn);
            });
        }

        function createNew() {
            const id = Date.now();
            sessions.unshift({ id, title: "Novo Ciclo", history: [] });
            currentId = id; save(); render();
        }

        function checkKey(e) { if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); triggerSend(); } }
        function save() { localStorage.setItem('ec_sessions', JSON.stringify(sessions)); }
        function resetData() { if(confirm("Apagar todos os registros?")) { localStorage.clear(); location.reload(); } }
        function init() { if(sessions.length > 0) { currentId = sessions[0].id; render(); } else { createNew(); } }

        runBoot();
    </script>
</body>
</html>
