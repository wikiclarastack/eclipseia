<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eclipse Intelligence | v62</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --glass: rgba(255, 255, 255, 0.03); --border: rgba(255, 255, 255, 0.08); }
        body { background: #000; color: #fff; font-family: 'Outfit', sans-serif; margin: 0; overflow: hidden; display: flex; }
        .sidebar { width: 300px; background: #050505; border-right: 1px solid var(--border); height: 100vh; display: flex; flex-direction: column; }
        .main-stage { flex-grow: 1; display: flex; flex-direction: column; height: 100vh; background: radial-gradient(circle at 50% -20%, #111, #000); position: relative; }
        .msg-node { max-width: 850px; margin: 0 auto 30px auto; padding: 25px; border-radius: 20px; background: var(--glass); border: 1px solid var(--border); }
        .input-container { background: rgba(15, 15, 15, 0.9); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 24px; padding: 12px 20px; display: flex; align-items: center; gap: 12px; }
        textarea { width: 100%; background: transparent; border: none; outline: none; resize: none; color: #fff; font-size: 14px; }
        pre { background: #080808 !important; padding: 15px; border-radius: 12px; border: 1px solid #222; overflow-x: auto; margin-top: 10px; }
        .hidden { display: none !important; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="p-8 border-b border-white/5">
            <h2 class="text-[10px] font-bold tracking-[0.5em] opacity-30 mb-8">ECLIPSE v62</h2>
            <button onclick="newSession()" class="w-full py-4 bg-white text-black rounded-xl font-bold text-[11px] uppercase tracking-widest">Nova Sessão</button>
        </div>
        <div id="session-list" class="flex-1 overflow-y-auto p-6 space-y-2 no-scrollbar"></div>
    </aside>

    <main class="main-stage">
        <header class="h-20 flex items-center justify-between px-10 border-b border-white/5">
            <span id="header-title" class="text-xs font-bold opacity-30 uppercase tracking-widest">Aguardando...</span>
            <button onclick="clearSystem()" class="text-[9px] text-red-500 font-bold opacity-40 hover:opacity-100 transition">WIPE DATA</button>
        </header>

        <div id="chat-flow" class="flex-1 overflow-y-auto py-10 no-scrollbar"></div>

        <div class="p-8">
            <div class="max-w-4xl mx-auto">
                <div id="file-preview" class="mb-3 flex gap-2"></div>
                <div class="input-container">
                    <label class="cursor-pointer opacity-40 hover:opacity-100 transition">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
                        <input type="file" class="hidden" onchange="handleFile(this)">
                    </label>
                    <textarea id="user-input" rows="1" placeholder="Envie um comando..." oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send();}"></textarea>
                    <button onclick="send()" class="opacity-40 hover:opacity-100 transition"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg></button>
                </div>
            </div>
        </div>
    </main>

    <script>
        let sessions = JSON.parse(localStorage.getItem('ec_v62_s')) || [];
        let curId = null;
        let userName = localStorage.getItem('ec_v62_u') || prompt("Nome de acesso:") || "User";
        localStorage.setItem('ec_v62_u', userName);
        let pending = null;

        function handleFile(input) {
            const file = input.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                pending = { mimeType: file.type, base64: e.target.result.split(',')[1], name: file.name };
                document.getElementById('file-preview').innerHTML = `<div class="bg-white/5 px-4 py-2 rounded-full text-[10px] flex items-center gap-2 border border-white/10">📎 ${file.name} <span class="cursor-pointer font-bold" onclick="pending=null;this.parentElement.remove()">✕</span></div>`;
            };
            reader.readAsDataURL(file);
        }

        async function send() {
            const ui = document.getElementById('user-input');
            const txt = ui.value.trim();
            if(!txt && !pending) return;

            const session = sessions.find(s => s.id === curId);
            session.history.push({ role: 'user', parts: [{ text: txt || "Analise o anexo." }] });
            if(session.title === "Nova Sessão") session.title = txt.substring(0, 20);

            ui.value = ""; ui.style.height = 'auto';
            const fContext = pending;
            pending = null; document.getElementById('file-preview').innerHTML = "";
            render();

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: session.history, userName, fileData: fContext })
                });

                // Verificação de segurança para o erro do print
                if (!res.ok) throw new Error(`HTTP Error: ${res.status}`);
                const data = await res.json();
                
                session.history.push({ role: 'model', parts: [{ text: data.reply }] });
            } catch(e) {
                session.history.push({ role: 'model', parts: [{ text: "Erro na Matrix: " + e.message }] });
            }
            save(); render();
        }

        function render() {
            const flow = document.getElementById('chat-flow');
            const session = sessions.find(s => s.id === curId);
            flow.innerHTML = "";
            document.getElementById('header-title').innerText = session.title;

            session.history.forEach(m => {
                const isAI = m.role === 'model';
                const div = document.createElement('div');
                div.className = 'msg-node';
                div.innerHTML = `<div class="text-[9px] font-bold tracking-widest uppercase opacity-20 mb-4">${isAI ? 'Eclipse IA' : userName}</div>
                                 <div class="text-sm leading-relaxed opacity-80">${marked.parse(m.parts[0].text)}</div>`;
                flow.appendChild(div);
            });
            flow.scrollTop = flow.scrollHeight;
            renderSide();
        }

        function renderSide() {
            const list = document.getElementById('session-list');
            list.innerHTML = "";
            sessions.forEach(s => {
                const d = document.createElement('div');
                d.className = `p-4 rounded-xl cursor-pointer text-[10px] font-bold uppercase transition ${s.id === curId ? 'bg-white text-black' : 'opacity-30 hover:opacity-100 hover:bg-white/5'}`;
                d.onclick = () => { curId = s.id; render(); };
                d.innerText = s.title;
                list.appendChild(d);
            });
        }

        function newSession() {
            const id = Date.now();
            sessions.unshift({ id, title: "Nova Sessão", history: [] });
            curId = id; save(); render();
        }

        function save() { localStorage.setItem('ec_v62_s', JSON.stringify(sessions)); }
        function clearSystem() { if(confirm("Limpar tudo?")) { localStorage.clear(); location.reload(); } }
        
        (() => { if(sessions.length > 0) { curId = sessions[0].id; render(); } else { newSession(); } })();
    </script>
</body>
</html>
